<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job HQ</title>
<link rel="preload" href="/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true"></span><strong>Job HQ</strong></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <button class="scan-side" id="scan-side" type="button"><span class="dot" aria-hidden="true"></span><span data-scan="side">Never scanned</span></button>
      <button class="btn ghost sm" id="keys-btn" type="button">Shortcuts <kbd>?</kbd></button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="drawer" class="drawer"></div>
<div id="modal" class="modal"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
